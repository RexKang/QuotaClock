name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race ./...
      # 验收 #20 的持续保障：运行时敏感三件套必须被忽略
      - name: gitignore 断言（config.json / key.bin / 锁文件 / cache.json）
        run: |
          git check-ignore config.json
          git check-ignore key.bin
          git check-ignore quotaclock-test.lock
          git check-ignore old-config.json
          git check-ignore cache.json
        shell: bash

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      # 验收 #1：三平台编译通过性冒烟（真实产物由 release job 的 GoReleaser 产出）
      - name: 三平台交叉编译冒烟
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/quotaclock
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/quotaclock
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/quotaclock

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
