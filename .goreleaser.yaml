version: 2

project_name: quotaclock

before:
  hooks:
    - go vet ./...
    - go test ./...

builds:
  - id: quotaclock
    main: ./cmd/quotaclock
    env:
      - CGO_ENABLED=0
    # 产物矩阵（PRD §9）：windows/amd64 + linux/amd64 + linux/arm64
    targets:
      - windows_amd64_v1
      - linux_amd64_v1
      - linux_arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{- if eq .Os "windows" }}windows{{- else }}{{ .Os }}{{- end }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

# Release 正文（含「本版重点」与提交明细）由 scripts/release_notes.py 生成后经
# `--release-notes release-notes.md` 传入（见 .github/workflows/ci.yml）。
# 因此这里关掉 goreleaser 自带的 changelog（它的输出是「40 位 SHA + 提交标题」的流水账，
# 而且 header 是固定模板 —— 用户反馈「每个 Release 内容看起来都一样」）。
release:
  draft: false
changelog:
  disable: true
