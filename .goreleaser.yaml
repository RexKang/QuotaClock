version: 2

project_name: quotaclock

before:
  hooks:
    - go vet ./...
    - go test ./...

builds:
  - id: quotaclock
    main: ./cmd/quotaclock
    env:
      - CGO_ENABLED=0
    # 产物矩阵（PRD §9）：windows/amd64 + linux/amd64 + linux/arm64
    targets:
      - windows_amd64_v1
      - linux_amd64_v1
      - linux_arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{- if eq .Os "windows" }}windows{{- else }}{{ .Os }}{{- end }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

release:
  draft: false
  header: |
    ## QuotaClock {{ .Tag }}

    单二进制服务端，下载对应平台产物解压即用。
    首次启动生成模板配置；默认密码 `Quota@2026090S`，登录后请立即修改。
    校验和见 `checksums.txt`（sha256）。
changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
